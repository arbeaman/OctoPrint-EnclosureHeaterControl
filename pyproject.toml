[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-EnclosureHeaterControl"
version = "2.0.0"
description = "Control a 3D printer enclosure heater."
authors = [
    {name = "Alerick Beaman", email = "35195829+arbeaman@users.noreply.github.com"}
]
readme = {file = "README.md", content-type = "text/markdown"}
dynamic = ["license"]
requires-python = ">=3.7, <4"

# any additional requirements besides OctoPrint should be listed here
dependencies = [
    "python-periphery"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_enclosureheatercontrol",
    "octoprint_enclosureheatercontrol.*"
]

[project.entry-points."octoprint.plugin"]
enclosureheatercontrol = "octoprint_enclosureheatercontrol"

[project.urls]
Homepage = "https://github.com/arbeaman/OctoPrint-EnclosureHeaterControl"
